<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Selfie Cam</title>
  <style>
    :root {
      --accent: #ffd84d;
      --glass: rgba(20, 20, 22, 0.55);
      --line: rgba(255, 255, 255, 0.16);
      --text: #ffffff;
      --dim: rgba(255, 255, 255, 0.62);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #000; color: var(--text); overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif; }
    button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }

    /* Camera preview fills the whole screen */
    #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #0b0b0c; }

    /* Soft dark gradients so text stays readable over the video */
    .shade { position: fixed; left: 0; right: 0; pointer-events: none; }
    .shade.top { top: 0; height: 22%; background: linear-gradient(rgba(0,0,0,.55), transparent); }
    .shade.bottom { bottom: 0; height: 38%; background: linear-gradient(transparent, rgba(0,0,0,.72)); }

    /* Top bar */
    #topbar { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 8px;
      padding: calc(env(safe-area-inset-top) + 12px) 14px 0; }
    .pill { background: var(--glass); border: 1px solid var(--line); border-radius: 999px;
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
    #status { padding: 9px 16px; font-size: 15px; font-weight: 600; letter-spacing: -0.2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background .2s, color .2s; }
    #status.ready { background: var(--accent); color: #1a1500; border-color: transparent; }
    #spacer { flex: 1; }
    #camSelect { display: none; max-width: 42vw; padding: 9px 12px; font-size: 13px; color: var(--text);
      appearance: none; -webkit-appearance: none; outline: none; }
    #camSelect option { color: #000; }
    #debugBtn { width: 38px; height: 38px; font-size: 14px; font-weight: 700; color: var(--dim); flex: none; }

    /* Big countdown number + white flash */
    #count { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 34vw; font-weight: 800; color: #fff; text-shadow: 0 6px 40px rgba(0,0,0,.5);
      pointer-events: none; opacity: 0; }
    #count.show { animation: pop .42s ease-out; }
    @keyframes pop { 0% { opacity: 0; transform: scale(.6); } 25% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.15); } }
    #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
    #flash.show { animation: flash .35s ease-out; }
    @keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }

    /* Bottom panel: condition chips + photo strip */
    #bottom { position: fixed; left: 0; right: 0; bottom: 0;
      padding: 0 14px calc(env(safe-area-inset-bottom) + 14px); }
    #chips { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
    .chip { padding: 8px 14px; font-size: 13px; font-weight: 600; color: var(--dim);
      transition: background .15s, color .15s, border-color .15s; }
    .chip.ok { background: var(--accent); color: #1a1500; border-color: transparent; }
    #stripRow { display: flex; align-items: center; gap: 10px; min-height: 64px; }
    #countLabel { font-size: 13px; color: var(--dim); flex: none; min-width: 44px; }
    #countLabel b { display: block; font-size: 22px; color: var(--text); font-weight: 700; }
    #gallery { display: flex; gap: 8px; overflow-x: auto; flex: 1; scrollbar-width: none; padding: 2px 0; }
    #gallery::-webkit-scrollbar { display: none; }
    #gallery img { width: 52px; height: 64px; object-fit: cover; border-radius: 10px; flex: none;
      border: 1.5px solid rgba(255,255,255,.7); }
    #emptyHint { font-size: 13px; color: var(--dim); }

    /* Debug numbers (hidden until the "i" button is tapped) */
    #debug { display: none; position: fixed; top: calc(env(safe-area-inset-top) + 64px); right: 14px;
      padding: 12px 14px; border-radius: 14px; font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace; text-align: left; }
    #debug.show { display: block; }

    /* Start screen */
    #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 32px; text-align: center;
      background: radial-gradient(120% 80% at 50% 0%, #2a2410 0%, #0b0b0c 55%, #000 100%); }
    #start h1 { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -1px; }
    #start p { margin: 0 0 18px; font-size: 15px; line-height: 1.6; color: var(--dim); }
    #startBtn { width: 92px; height: 92px; border-radius: 50%; background: var(--accent); color: #1a1500;
      font-size: 17px; font-weight: 800; box-shadow: 0 0 0 6px rgba(255,216,77,.18), 0 12px 40px rgba(255,216,77,.25); }
    #startBtn:active { transform: scale(.96); }
    #startMsg { min-height: 20px; font-size: 13px; color: var(--dim); margin-top: 8px; }

    /* Photo viewer */
    #viewer { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.94); flex-direction: column; }
    #viewer.show { display: flex; }
    #viewerImg { flex: 1; min-height: 0; width: 100%; object-fit: contain; padding: calc(env(safe-area-inset-top) + 12px) 12px 12px; }
    #viewerBar { display: flex; gap: 10px; padding: 0 14px calc(env(safe-area-inset-bottom) + 16px); }
    #viewerBar button { flex: 1; padding: 15px 0; border-radius: 14px; font-size: 16px; font-weight: 700;
      background: rgba(255,255,255,.12); }
    #viewerBar button.primary { background: var(--accent); color: #1a1500; }
    #viewerNote { text-align: center; font-size: 12px; color: var(--dim); padding: 0 14px 10px; }
  </style>
</head>
<body>
  <!-- playsinline + muted are required for inline video on iPhone Safari -->
  <video id="video" autoplay playsinline muted></video>
  <div class="shade top"></div>
  <div class="shade bottom"></div>

  <div id="topbar">
    <div id="status" class="pill">준비 중</div>
    <div id="spacer"></div>
    <select id="camSelect" class="pill" aria-label="카메라 선택"></select>
    <button id="debugBtn" class="pill" aria-label="숫자 보기">i</button>
  </div>

  <div id="debug" class="pill"></div>
  <div id="count"></div>
  <div id="flash"></div>

  <div id="bottom">
    <div id="chips">
      <div class="chip pill" id="chipFace">얼굴</div>
      <div class="chip pill" id="chipSize">거리</div>
      <div class="chip pill" id="chipInside">화면 안</div>
      <div class="chip pill" id="chipStill">멈춤</div>
    </div>
    <div id="stripRow">
      <div id="countLabel"><b id="photoCount">0</b>장</div>
      <div id="gallery"><span id="emptyHint">표정이나 각도를 바꿀 때마다 찍혀요</span></div>
    </div>
  </div>

  <div id="viewer">
    <img id="viewerImg" alt="">
    <div id="viewerNote">아이폰은 사진을 길게 눌러 "사진 앱에 저장"도 할 수 있어요</div>
    <div id="viewerBar">
      <button id="closeBtn">닫기</button>
      <button id="delBtn">삭제</button>
      <button id="shareBtn">공유</button>
      <button id="saveBtn" class="primary">저장</button>
    </div>
  </div>

  <div id="start">
    <h1>Selfie Cam</h1>
    <p>후면 카메라를 얼굴 쪽으로 돌리고<br>표정과 각도를 자유롭게 바꿔보세요.<br>바뀔 때마다 자동으로 찍어요.<br>소리로 알려주니 볼륨을 켜주세요.</p>
    <button id="startBtn">시작</button>
    <div id="startMsg"></div>
  </div>

  <script type="module">
    // MediaPipe Tasks Vision (runs fully on-device, in the browser)
    import { FaceLandmarker, FilesetResolver }
      from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

    const VERSION   = "v4.0";
    const WASM_URL  = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
    const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";

    // Auto-capture rules: shoot whenever the face is well framed, holds still
    // for a moment, and looks different from the last photo taken
    const RULES = {
      minFaceHeight: 0.10, // face height must be at least 10% of the frame height
      minInside: 0.90,     // at least 90% of the face box must be inside the frame
      angleScale: 40,      // degrees are divided by this before comparing
      stillMs: 300,        // compare with the face 300 ms ago ...
      stillMax: 0.20,      // ... and it must have changed less than this (not moving)
      changeMin: 0.45,     // must differ this much from the last photo
      minGapMs: 1200,      // shortest time between two photos
      maxPhotos: 40        // stop after this many photos (phone memory)
    };

    const $ = (id) => document.getElementById(id);
    const video = $("video"), statusEl = $("status"), camSelect = $("camSelect");
    const debugEl = $("debug"), countEl = $("count"), flashEl = $("flash");
    const gallery = $("gallery"), photoCountEl = $("photoCount");
    const startScreen = $("start"), startBtn = $("startBtn"), startMsg = $("startMsg");
    const viewer = $("viewer"), viewerImg = $("viewerImg");
    const chips = { face: $("chipFace"), size: $("chipSize"), inside: $("chipInside"), still: $("chipStill") };

    let landmarker = null, audioCtx = null, currentStream = null;
    let camInfo = "", faceVisible = false, lastVideoTime = -1, frameCount = 0;
    let photoCount = 0, lastShotAt = 0, lastShotVec = null, framedOk = false;
    const recent = [];        // feature vectors from the last few hundred ms
    let viewing = null;       // { blob, name, url } of the photo open in the viewer
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    // ---- Sound: short beep using Web Audio (no audio files needed) ----
    function beep(freq = 880, durationMs = 150) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      gain.gain.value = 0.3;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + durationMs / 1000);
    }

    // ---- Camera: open a rear camera at high resolution ----
    async function startCamera(deviceId) {
      if (currentStream) currentStream.getTracks().forEach(t => t.stop());
      const v = { width: { ideal: 1920 }, height: { ideal: 1080 } };
      if (deviceId) v.deviceId = { exact: deviceId };
      else v.facingMode = { ideal: "environment" };
      currentStream = await navigator.mediaDevices.getUserMedia({ video: v, audio: false });
      video.srcObject = currentStream;
      await video.play();
      const s = currentStream.getVideoTracks()[0].getSettings();
      camInfo = `${s.width}x${s.height}`;
      return s.deviceId;
    }

    // Friendlier names for the camera menu
    function camName(label, i) {
      if (/ultra|초광각/i.test(label) || /camera2?\s*2,/i.test(label)) return "초광각";
      if (/tele|망원/i.test(label)) return "망원";
      if (/camera2 0,/i.test(label)) return "일반";
      return label || `카메라 ${i + 1}`;
    }

    // ---- List rear cameras (phones often have wide / ultra-wide / tele) ----
    async function setupCameraList(activeId) {
      const all = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
      let cams = all.filter(d => /back|rear|environment|후면/i.test(d.label));
      if (cams.length === 0) cams = all;

      camSelect.innerHTML = "";
      cams.forEach((d, i) => {
        const opt = document.createElement("option");
        opt.value = d.deviceId;
        opt.textContent = camName(d.label, i);
        camSelect.appendChild(opt);
      });
      if (cams.length > 1) camSelect.style.display = "block";

      // Always start on the ultra-wide rear camera (a manual pick lasts until the page is reloaded)
      let want = cams.find(d => /ultra|초광각/i.test(d.label));
      if (!want) want = cams.find(d => /camera2?\s*2,/i.test(d.label));
      if (want && want.deviceId !== activeId) activeId = await startCamera(want.deviceId);
      camSelect.value = activeId;
    }
    camSelect.addEventListener("change", async () => {
      try { await startCamera(camSelect.value); }
      catch (err) { setStatus("카메라 전환 실패"); }
    });

    // ---- Load the face model ----
    async function createLandmarker() {
      const fileset = await FilesetResolver.forVisionTasks(WASM_URL);
      // CPU only: on some phones the GPU mode returns frozen / wrong values
      return await FaceLandmarker.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: MODEL_URL, delegate: "CPU" },
        runningMode: "VIDEO",
        numFaces: 1,
        outputFaceBlendshapes: true,              // 52 expression scores
        outputFacialTransformationMatrixes: true  // head pose matrix
      });
    }

    // ---- 4x4 matrix (column-major) -> yaw / pitch / roll in degrees ----
    function matrixToAngles(m) {
      const r = (row, col) => m[col * 4 + row];
      const toDeg = (rad) => rad * 180 / Math.PI;
      return {
        pitch: toDeg(Math.atan2(r(2, 1), r(2, 2))),  // up / down
        yaw:   toDeg(Math.asin(-r(2, 0))),           // left / right
        roll:  toDeg(Math.atan2(r(1, 0), r(0, 0)))   // head tilt
      };
    }
    function score(blendshapes, name) {
      const c = blendshapes.find(x => x.categoryName === name);
      return c ? c.score : 0;
    }

    // ---- Small UI helpers ----
    function setStatus(text, ready = false) {
      if (statusEl.textContent !== text) statusEl.textContent = text;
      statusEl.classList.toggle("ready", ready);
    }
    function setChip(el, ok) { el.classList.toggle("ok", ok); }
    function replay(el, text) {       // restart a CSS animation
      if (text !== undefined) el.textContent = text;
      el.classList.remove("show");
      void el.offsetWidth;
      el.classList.add("show");
    }

    // ---- Main loop ----
    function loop() {
      try { step(); }
      catch (err) { setStatus("오류: " + err.message); }
      requestAnimationFrame(loop);
    }

    // ---- Feature vector: 52 expression scores + 3 head angles ----
    function featureVec(bs, yaw, pitch, roll) {
      const v = bs.map(c => c.score);
      v.push(yaw / RULES.angleScale, pitch / RULES.angleScale, roll / RULES.angleScale);
      return v;
    }
    function dist(a, b) {
      let sum = 0;
      for (let i = 0; i < a.length; i++) { const d = a[i] - b[i]; sum += d * d; }
      return Math.sqrt(sum);
    }

    // ---- Face box from landmarks (coordinates are 0..1 of the frame) ----
    function faceBox(lm) {
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const p of lm) {
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      }
      const w = maxX - minX, h = maxY - minY;
      const ix = Math.max(0, Math.min(maxX, 1) - Math.max(minX, 0));
      const iy = Math.max(0, Math.min(maxY, 1) - Math.max(minY, 0));
      return { h, inside: (ix * iy) / (w * h) };
    }

    function step() {
      if (video.readyState < 2) return;   // camera is switching, no frame yet
      if (video.currentTime === lastVideoTime) return;
      lastVideoTime = video.currentTime;
      frameCount++;

      const now = performance.now();
      const result = landmarker.detectForVideo(video, now);
      const hasFace = result.faceLandmarks && result.faceLandmarks.length > 0;
      let okSize = false, okInside = false, still = false;
      let dbg = "face: no";

      if (hasFace) {
        const { yaw, pitch, roll } = matrixToAngles(result.facialTransformationMatrixes[0].data);
        const bs = result.faceBlendshapes[0].categories;
        const box = faceBox(result.faceLandmarks[0]);
        okSize = box.h >= RULES.minFaceHeight;
        okInside = box.inside >= RULES.minInside;

        // Is the face holding still? Compare with the sample from ~300 ms ago
        const vec = featureVec(bs, yaw, pitch, roll);
        while (recent.length && now - recent[0].t > RULES.stillMs + 200) recent.shift();
        const old = recent.length && now - recent[0].t >= RULES.stillMs ? recent[0] : null;
        const move = old ? dist(vec, old.vec) : Infinity;
        still = move < RULES.stillMax;
        recent.push({ t: now, vec });

        const change = lastShotVec ? dist(vec, lastShotVec) : Infinity;
        const full = photoCount >= RULES.maxPhotos;
        if (okSize && okInside && still && !full &&
            change >= RULES.changeMin && now - lastShotAt >= RULES.minGapMs) {
          lastShotAt = now;
          lastShotVec = vec;
          takePhoto();
          replay(flashEl);
          beep(1500, 60);                       // shutter sound: two quick clicks
          setTimeout(() => beep(1500, 60), 120);
        }

        const smile = (score(bs, "mouthSmileLeft") + score(bs, "mouthSmileRight")) / 2;
        dbg = `yaw   ${yaw.toFixed(0)}°<br>pitch ${pitch.toFixed(0)}°<br>roll  ${roll.toFixed(0)}°<br>` +
              `smile ${(smile * 100).toFixed(0)}%<br>` +
              `size  ${(box.h * 100).toFixed(0)}%<br>` +
              `move  ${isFinite(move) ? move.toFixed(2) : "-"}<br>` +
              `change ${isFinite(change) ? change.toFixed(2) : "-"}`;
      } else {
        recent.length = 0;
      }

      // Sound: high beep when the face becomes well framed, low beep when it is lost
      const framed = hasFace && okSize && okInside;
      if (framed && !framedOk) beep(880);
      if (!framed && framedOk) beep(330);
      framedOk = framed;

      setChip(chips.face, hasFace);
      setChip(chips.size, okSize);
      setChip(chips.inside, okInside);
      setChip(chips.still, still);

      if (!hasFace) setStatus("얼굴을 찾는 중");
      else if (!okSize) setStatus("조금 더 가까이");
      else if (!okInside) setStatus("얼굴이 화면 밖으로 나갔어요");
      else if (photoCount >= RULES.maxPhotos) setStatus(`${RULES.maxPhotos}장 다 찍었어요`, true);
      else setStatus("찍는 중 · 표정을 바꿔보세요", true);

      if (debugEl.classList.contains("show")) {
        debugEl.innerHTML = `${dbg}<br>${camInfo}<br>frame ${frameCount}<br>${VERSION}`;
      }
    }

    // ---- Copy the current video frame into a JPEG (stays on the phone) ----
    function takePhoto() {
      const c = document.createElement("canvas");
      c.width = video.videoWidth;
      c.height = video.videoHeight;
      c.getContext("2d").drawImage(video, 0, 0);
      c.toBlob((blob) => {
        if (!blob) return;
        photoCount++;
        photoCountEl.textContent = photoCount;
        const photo = { blob, name: `selfie_${Date.now()}.jpg`, url: URL.createObjectURL(blob) };
        const img = document.createElement("img");
        img.src = photo.url;
        img.alt = photo.name;
        photo.img = img;
        img.addEventListener("click", () => openViewer(photo));
        const hint = $("emptyHint");
        if (hint) hint.remove();
        gallery.prepend(img);
      }, "image/jpeg", 0.95);
    }

    // ---- Photo viewer: save (download) or share ----
    function openViewer(photo) {
      viewing = photo;
      viewerImg.src = photo.url;
      viewer.classList.add("show");
    }
    $("closeBtn").addEventListener("click", () => viewer.classList.remove("show"));
    $("delBtn").addEventListener("click", () => {
      if (!viewing) return;
      viewing.img.remove();
      URL.revokeObjectURL(viewing.url);
      photoCount--;
      photoCountEl.textContent = photoCount;
      viewing = null;
      viewer.classList.remove("show");
    });
    $("saveBtn").addEventListener("click", () => {
      if (!viewing) return;
      const a = document.createElement("a");
      a.href = viewing.url;
      a.download = viewing.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
    });
    $("shareBtn").addEventListener("click", async () => {
      if (!viewing) return;
      const file = new File([viewing.blob], viewing.name, { type: "image/jpeg" });
      if (!(navigator.canShare && navigator.canShare({ files: [file] }))) {
        $("viewerNote").textContent = "이 브라우저는 공유를 지원하지 않아요. 저장을 눌러주세요.";
        return;
      }
      try { await navigator.share({ files: [file] }); } catch (e) { /* user cancelled */ }
    });

    $("debugBtn").addEventListener("click", () => debugEl.classList.toggle("show"));

    // ---- Start button: sound + camera + model ----
    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      try {
        // iPhone only allows sound after a tap, so create audio here
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        await audioCtx.resume();

        startMsg.textContent = "카메라 켜는 중…";
        const activeId = await startCamera(null);
        await setupCameraList(activeId);

        startMsg.textContent = "얼굴 인식 준비 중… (처음엔 10초 정도)";
        landmarker = await createLandmarker();

        startScreen.style.display = "none";
        beep(660, 100);
        loop();
      } catch (err) {
        startMsg.textContent = "실패: " + err.name + " - " + err.message;
        startBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
