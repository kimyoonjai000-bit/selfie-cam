<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rear Camera Test</title>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: sans-serif; text-align: center; }
    video { width: 100%; max-height: 80vh; background: #222; }
    button { font-size: 20px; padding: 14px 28px; margin: 16px; border-radius: 12px; border: none; }
    #status { padding: 8px; }
  </style>
</head>
<body>
  <button id="startBtn">카메라 켜기</button>
  <div id="status">버튼을 눌러 후면 카메라를 켜세요</div>
  <!-- playsinline + muted are required for video to play inline on iPhone Safari -->
  <video id="video" autoplay playsinline muted></video>

  <script>
    const btn = document.getElementById('startBtn');
    const video = document.getElementById('video');
    const status = document.getElementById('status');

    btn.addEventListener('click', async () => {
      try {
        // facingMode "environment" = rear camera
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        video.srcObject = stream;
        status.textContent = '후면 카메라 켜짐 ✅';
        btn.style.display = 'none';
      } catch (err) {
        status.textContent = '실패: ' + err.name + ' - ' + err.message;
      }
    });
  </script>
</body>
</html>
