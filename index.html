<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffe3ec">
  <title>YJ Selfie Camera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #ff9dbb;
      --glass: rgba(20, 20, 22, 0.55);
      --line: rgba(255, 255, 255, 0.16);
      --text: #ffffff;
      --dim: rgba(255, 255, 255, 0.62);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #000; color: var(--text); overflow: hidden;
      font-family: "Jua", ui-rounded, -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif; }
    button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }

    /* Camera preview fills the whole screen */
    #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #0b0b0c; }

    /* 3x3 grid drawn exactly over the video frame, with the nose target */
    #grid { position: fixed; pointer-events: none; }
    #grid i { position: absolute; background: rgba(255,255,255,.38); }
    #grid .v { top: 0; bottom: 0; width: 1px; }
    #grid .h { left: 0; right: 0; height: 1px; }
    #grid .target { width: 18px; height: 18px; margin: -9px 0 0 -9px; left: 50%; top: 33.333%;
      background: none; border: 2px solid var(--accent); border-radius: 50%; }

    /* Soft dark gradients so text stays readable over the video */
    .shade { position: fixed; left: 0; right: 0; pointer-events: none; }
    .shade.top { top: 0; height: 22%; background: linear-gradient(rgba(0,0,0,.55), transparent); }
    .shade.bottom { bottom: 0; height: 38%; background: linear-gradient(transparent, rgba(0,0,0,.72)); }

    /* Top bar */
    #topbar { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 8px;
      padding: calc(env(safe-area-inset-top) + 12px) 14px 0; }
    .pill { background: var(--glass); border: 1px solid var(--line); border-radius: 999px;
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
    #status { min-width: 0; padding: 9px 14px; font-size: 15px; font-weight: 600; letter-spacing: -0.2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background .2s, color .2s; }
    #status.ready { background: var(--accent); color: #4a2230; border-color: transparent; }
    #spacer { flex: 1; }
    #camSelect { display: none; max-width: 42vw; padding: 9px 12px; font-size: 13px; color: var(--text);
      appearance: none; -webkit-appearance: none; outline: none; }
    #camSelect option { color: #000; }
    #debugBtn { width: 38px; height: 38px; font-size: 14px; font-weight: 700; color: var(--dim); flex: none; }

    /* Big countdown number + white flash */
    #count { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 34vw; font-weight: 800; color: #fff; text-shadow: 0 6px 40px rgba(0,0,0,.5);
      pointer-events: none; opacity: 0; }
    #count.show { animation: pop .42s ease-out; }
    @keyframes pop { 0% { opacity: 0; transform: scale(.6); } 25% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.15); } }
    #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
    #flash.show { animation: flash .35s ease-out; }
    @keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }

    /* Bottom panel: condition chips + photo strip */
    #bottom { position: fixed; left: 0; right: 0; bottom: 0;
      padding: 0 14px calc(env(safe-area-inset-bottom) + 14px); }
    #chips { display: flex; gap: 6px; justify-content: center; margin-bottom: 14px; }
    .chip { padding: 8px 10px; font-size: 12px; white-space: nowrap; font-weight: 600; color: var(--dim);
      transition: background .15s, color .15s, border-color .15s; }
    .chip.ok { background: var(--accent); color: #4a2230; border-color: transparent; }
    #stripRow { display: flex; align-items: center; gap: 10px; min-height: 64px; }
    #countLabel { font-size: 13px; color: var(--dim); flex: none; min-width: 44px; }
    #countLabel b { display: block; font-size: 22px; color: var(--text); font-weight: 700; }
    #gallery { display: flex; gap: 8px; overflow-x: auto; flex: 1; scrollbar-width: none; padding: 2px 0; }
    #gallery::-webkit-scrollbar { display: none; }
    #gallery img { width: 52px; height: 64px; object-fit: cover; border-radius: 10px; flex: none;
      border: 1.5px solid rgba(255,255,255,.7); }
    #emptyHint { font-size: 13px; color: var(--dim); }

    /* Debug numbers (hidden until the "i" button is tapped) */
    #debug { display: none; position: fixed; top: calc(env(safe-area-inset-top) + 64px); right: 14px;
      padding: 12px 14px; border-radius: 14px; font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace; text-align: left; }
    #debug.show { display: block; }

    /* Mascot (original character: a goofy, shameless golden monkey holding a camera) */
    .mascot svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .mascot g[class^="f-"] { display: none; }
    .mascot[data-face="idle"] .f-idle { display: inline; }
    .mascot[data-face="happy"] .f-happy { display: inline; }
    .mascot[data-face="shot"] .f-shot { display: inline; }
    .mascot[data-face="sleep"] .f-sleep { display: inline; }
    .mascot[data-face="wake"] .f-wake { display: inline; }
    .mascot[data-face="sulk"] .f-sulk { display: inline; }
    .mascot[data-face="angry"] .f-angry { display: inline; }
    .mascot[data-face="sorry"] .f-sorry { display: inline; }
    .mascot[data-face="excited"] .f-excited { display: inline; }
    .mascot[data-face="cry"] .f-cry { display: inline; }
    .mascot[data-face="calm"] .f-calm { display: inline; }
    .mascot[data-face="warm"] .f-warm { display: inline; }
    .mascot[data-face="love"] .f-love { display: inline; }
    .mascot[data-face="care"] .f-care { display: inline; }
    /* Couple stickers scattered around the start screen */
    #startMascot { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    #startMascot .pair { position: absolute; display: flex; }
    #startMascot .pair > div { display: flex; animation: bob 2.8s ease-in-out infinite; }
    #startMascot .mascot + .mascot { margin-left: -8%; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    #miniMascot { display: flex; flex: none; filter: drop-shadow(0 2px 6px rgba(0,0,0,.35)); }
    #miniMascot .mascot { width: 54px; height: 54px; }
    #miniMascot .mascot + .mascot { margin-left: -8px; }
    #miniMascot.show { animation: hop .5s ease-out; }
    @keyframes hop { 0% { transform: translateY(0) scale(1); } 35% { transform: translateY(-12px) scale(1.12); }
      100% { transform: translateY(0) scale(1); } }

    /* Start screen */
    #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 32px; text-align: center;
      background: linear-gradient(180deg, #fff3ec 0%, #ffe3ec 55%, #ffd3e2 100%); color: #5a3340; }
    #start h1 { margin: 0; font-size: 36px; font-weight: 400; letter-spacing: 0; color: #e0607f; }
    #start h1, #slogan, #startBtn, #startMsg { position: relative; }
    #slogan { font-size: 21px; line-height: 1.5; color: #8a5a66; margin-bottom: 10px; }
    #slogan b { font-weight: 400; font-size: 30px; color: #e0607f; }
    #startFoot { position: absolute; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 12px); }
    #startFoot p { margin: 0 0 4px; font-size: 11.5px; line-height: 1.5; color: #a67784; }
    #startBtn { width: 92px; height: 92px; border-radius: 50%; background: var(--accent); color: #4a2230;
      font-size: 20px; font-weight: 400; color: #fff; background: #ff7fa6; box-shadow: 0 0 0 8px rgba(255,127,166,.22), 0 12px 30px rgba(255,127,166,.35); }
    #startBtn:active { transform: scale(.96); }
    #learnBtn { padding: 4px 8px; font-size: 11px; color: #b88a96; text-decoration: underline; }
    #refPanel { display: none; position: fixed; inset: 0; background: #0b0b0c; flex-direction: column;
      padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px); }
    #refPanel.show { display: flex; }
    #refPanel h2 { margin: 0 0 10px; font-size: 20px; }
    #refText { flex: 1; min-height: 0; overflow: auto; margin: 0 0 12px; padding: 12px; border-radius: 12px;
      background: rgba(255,255,255,.08); font: 13px/1.6 ui-monospace, Menlo, Consolas, monospace;
      white-space: pre-wrap; text-align: left; }
    #refBar { display: flex; gap: 10px; }
    #refBar button { flex: 1; padding: 14px 0; border-radius: 14px; font-size: 16px; font-weight: 700;
      background: rgba(255,255,255,.12); }
    #refBar button.primary { background: var(--accent); color: #4a2230; }
    #startMsg { min-height: 20px; font-size: 14px; color: #8a5a66; margin-top: 8px; }

    /* Photo viewer */
    #viewer { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.94); flex-direction: column; }
    #viewer.show { display: flex; }
    #viewerImg { flex: 1; min-height: 0; width: 100%; object-fit: contain; padding: calc(env(safe-area-inset-top) + 12px) 12px 12px; }
    #viewerBar { display: flex; gap: 10px; padding: 0 14px calc(env(safe-area-inset-bottom) + 16px); }
    #viewerBar button { flex: 1; padding: 15px 0; border-radius: 14px; font-size: 16px; font-weight: 700;
      background: rgba(255,255,255,.12); }
    #viewerBar button.primary { background: var(--accent); color: #4a2230; }
    #viewerNote { text-align: center; font-size: 12px; color: var(--dim); padding: 0 14px 10px; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <!-- Slightly wobbly lines, like a hand drawing -->
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
  </svg>

  <!-- playsinline + muted are required for inline video on iPhone Safari -->
  <video id="video" autoplay playsinline muted></video>
  <div id="grid">
    <i class="v" style="left:33.333%"></i><i class="v" style="left:66.666%"></i>
    <i class="h" style="top:33.333%"></i><i class="h" style="top:66.666%"></i>
    <i class="target"></i>
  </div>
  <div class="shade top"></div>
  <div class="shade bottom"></div>

  <div id="topbar">
    <div id="miniMascot"><div class="mascot" id="miniGirl"></div><div class="mascot" id="miniBoy"></div></div>
    <div id="status" class="pill">준비 중</div>
    <div id="spacer"></div>
    <select id="camSelect" class="pill" aria-label="카메라 선택"></select>
    <button id="debugBtn" class="pill" aria-label="숫자 보기">i</button>
  </div>

  <div id="debug" class="pill"></div>
  <div id="count"></div>
  <div id="flash"></div>

  <div id="bottom">
    <div id="chips">
      <div class="chip pill" id="chipDist">거리</div>
      <div class="chip pill" id="chipNose">코 높이</div>
      <div class="chip pill" id="chipCenter">가운데</div>
      <div class="chip pill" id="chipAngle">각도</div>
      <div class="chip pill" id="chipStill">멈춤</div>
    </div>
    <div id="stripRow">
      <div id="countLabel"><b id="photoCount">0</b>장</div>
      <div id="gallery"><span id="emptyHint">코 끝을 윗줄 가운데(노란 원)에 맞추면 찍혀요</span></div>
    </div>
  </div>

  <div id="viewer">
    <img id="viewerImg" alt="">
    <div id="viewerNote">아이폰은 사진을 길게 눌러 "사진 앱에 저장"도 할 수 있어요</div>
    <div id="viewerBar">
      <button id="closeBtn">닫기</button>
      <button id="delBtn">삭제</button>
      <button id="shareBtn">공유</button>
      <button id="saveBtn" class="primary">저장</button>
    </div>
  </div>

  <div id="start">
    <div id="startMascot"></div>
    <h1>YJ Selfie Camera</h1>
    <div id="slogan">우디니에 의한<br>우디니를 위한<br><b>우의우위</b></div>
    <button id="startBtn">시작</button>
    <div id="startMsg"></div>
    <div id="startFoot">
      <p>후면 카메라를 얼굴 쪽으로 돌리고 음성 안내에 따라 폰을 움직여 주세요.<br>구도가 맞으면 자동으로 찍어요. 볼륨을 켜주세요.</p>
      <button id="learnBtn">기준 사진 구도 분석</button>
    </div>
    <input type="file" id="refInput" accept="image/*" multiple hidden>
  </div>

  <div id="refPanel">
    <h2>기준 사진 구도 분석</h2>
    <pre id="refText"></pre>
    <div id="refBar">
      <button id="refClose">닫기</button>
      <button id="refCopy" class="primary">결과 복사</button>
    </div>
  </div>

  <script type="module">
    // MediaPipe Tasks Vision (runs fully on-device, in the browser)
    import { FaceLandmarker, FilesetResolver }
      from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

    const VERSION   = "v6.7";
    const WASM_URL  = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
    const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";

    // Auto-capture rules: shoot only when the composition matches
    // (nose tip on the upper grid line, horizontally centered), the face holds
    // still, and it looks different from the last photo taken
    const RULES = {
      noseY: 1 / 3,        // nose tip should sit on the upper horizontal grid line
      tolY: 0.035,         // allowed up/down error (fraction of frame height)
      tolX: 0.07,          // allowed left/right error (fraction of frame width)
      sizeMin: 0.30,       // face height as a fraction of frame height: target is about 36%
      sizeMax: 0.42,
      pitchMin: 20,        // head pitch seen from the camera: target is about 26-30 degrees
      pitchMax: 36,
      angleScale: 40,      // degrees are divided by this before comparing
      stillMs: 300,        // compare with the face 300 ms ago ...
      stillMax: 0.25,      // ... and it must have changed less than this (not moving)
      changeMin: 0.60,     // must differ this much from the last photo
      minGapMs: 1500,      // while the composition stays right, shoot again every 1.5 s
      maxPhotos: 40        // stop after this many photos (phone memory)
    };
    const NOSE_TIP = 1, CHIN = 152;   // MediaPipe face landmark indices

    const $ = (id) => document.getElementById(id);
    const video = $("video"), statusEl = $("status"), camSelect = $("camSelect");
    const debugEl = $("debug"), countEl = $("count"), flashEl = $("flash");
    const gallery = $("gallery"), photoCountEl = $("photoCount");
    const startScreen = $("start"), startBtn = $("startBtn"), startMsg = $("startMsg");
    const viewer = $("viewer"), viewerImg = $("viewerImg");
    const chips = { dist: $("chipDist"), angle: $("chipAngle"), nose: $("chipNose"), center: $("chipCenter"), still: $("chipStill") };

    let landmarker = null, audioCtx = null, currentStream = null;
    let camInfo = "", faceVisible = false, lastVideoTime = -1, frameCount = 0;
    let photoCount = 0, lastShotAt = 0, lastShotVec = null, framedOk = false, noFaceSince = 0;
    let framedSince = 0, lastFramedAt = 0, lostAt = 0, hintText = "", hintSince = 0;
    const hold = { nose: false, center: false, dist: false, angle: false };
    const recent = [];        // feature vectors from the last few hundred ms
    const prevOk = {}, okBeepAt = {};   // per-condition state for the progress beeps
    let viewing = null;       // { blob, name, url } of the photo open in the viewer
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    // ---- Sound: short beep using Web Audio (no audio files needed) ----
    function beep(freq = 880, durationMs = 150) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      gain.gain.value = 0.3;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + durationMs / 1000);
    }

    // ---- Camera: open a rear camera at high resolution ----
    async function startCamera(deviceId) {
      if (currentStream) currentStream.getTracks().forEach(t => t.stop());
      const v = { width: { ideal: 1920 }, height: { ideal: 1440 } };  // 4:3 like the camera app
      if (deviceId) v.deviceId = { exact: deviceId };
      else v.facingMode = { ideal: "environment" };
      currentStream = await navigator.mediaDevices.getUserMedia({ video: v, audio: false });
      video.srcObject = currentStream;
      await video.play();
      const s = currentStream.getVideoTracks()[0].getSettings();
      camInfo = `${s.width}x${s.height}`;
      layoutGrid();
      return s.deviceId;
    }

    // Put the grid exactly on top of the displayed video frame
    function layoutGrid() {
      const vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh) return;
      const W = window.innerWidth, H = window.innerHeight;
      const k = Math.min(W / vw, H / vh);
      const g = $("grid");
      g.style.width = vw * k + "px";
      g.style.height = vh * k + "px";
      g.style.left = (W - vw * k) / 2 + "px";
      g.style.top = (H - vh * k) / 2 + "px";
    }
    window.addEventListener("resize", layoutGrid);
    video.addEventListener("loadedmetadata", layoutGrid);

    // ---- Voice guidance (she cannot see the screen) ----
    let lastSaid = "", lastSaidAt = 0;
    function say(text, now) {
      if (!("speechSynthesis" in window)) return;
      if (now - lastSaidAt < 1800) return;                       // do not talk over itself
      if (text === lastSaid && now - lastSaidAt < 6000) return;  // repeat the same hint slowly
      lastSaid = text;
      lastSaidAt = now;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ko-KR";
      u.rate = 1.1;
      speechSynthesis.speak(u);
    }

    // Friendlier names for the camera menu
    function camName(label, i) {
      if (/ultra|초광각/i.test(label) || /camera2?\s*2,/i.test(label)) return "초광각";
      if (/tele|망원/i.test(label)) return "망원";
      if (/camera2 0,/i.test(label)) return "일반";
      return label || `카메라 ${i + 1}`;
    }

    // ---- List rear cameras (phones often have wide / ultra-wide / tele) ----
    async function setupCameraList(activeId) {
      const all = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
      let cams = all.filter(d => /back|rear|environment|후면/i.test(d.label));
      if (cams.length === 0) cams = all;

      camSelect.innerHTML = "";
      cams.forEach((d, i) => {
        const opt = document.createElement("option");
        opt.value = d.deviceId;
        opt.textContent = camName(d.label, i);
        camSelect.appendChild(opt);
      });
      if (cams.length > 1) camSelect.style.display = "block";

      // Always start on the ultra-wide rear camera (a manual pick lasts until the page is reloaded)
      let want = cams.find(d => /ultra|초광각/i.test(d.label));
      if (!want) want = cams.find(d => /camera2?\s*2,/i.test(d.label));
      if (want && want.deviceId !== activeId) activeId = await startCamera(want.deviceId);
      camSelect.value = activeId;
    }
    camSelect.addEventListener("change", async () => {
      try { await startCamera(camSelect.value); }
      catch (err) { setStatus("카메라 전환 실패"); }
    });

    // ---- Load the face model ----
    let filesetPromise = null;
    function getFileset() {
      if (!filesetPromise) filesetPromise = FilesetResolver.forVisionTasks(WASM_URL);
      return filesetPromise;
    }
    async function createLandmarker() {
      const fileset = await getFileset();
      // CPU only: on some phones the GPU mode returns frozen / wrong values
      return await FaceLandmarker.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: MODEL_URL, delegate: "CPU" },
        runningMode: "VIDEO",
        numFaces: 1,
        outputFaceBlendshapes: true,              // 52 expression scores
        outputFacialTransformationMatrixes: true  // head pose matrix
      });
    }

    // ---- 4x4 matrix (column-major) -> yaw / pitch / roll in degrees ----
    function matrixToAngles(m) {
      const r = (row, col) => m[col * 4 + row];
      const toDeg = (rad) => rad * 180 / Math.PI;
      return {
        pitch: toDeg(Math.atan2(r(2, 1), r(2, 2))),  // up / down
        yaw:   toDeg(Math.asin(-r(2, 0))),           // left / right
        roll:  toDeg(Math.atan2(r(1, 0), r(0, 0)))   // head tilt
      };
    }
    function score(blendshapes, name) {
      const c = blendshapes.find(x => x.categoryName === name);
      return c ? c.score : 0;
    }

    // ---- Small UI helpers ----
    function setStatus(text, ready = false) {
      if (statusEl.textContent !== text) statusEl.textContent = text;
      statusEl.classList.toggle("ready", ready);
    }
    function setChip(el, ok) { el.classList.toggle("ok", ok); }
    function replay(el, text) {       // restart a CSS animation
      if (text !== undefined) el.textContent = text;
      el.classList.remove("show");
      void el.offsetWidth;
      el.classList.add("show");
    }

    // ---- Main loop ----
    function loop() {
      try { step(); }
      catch (err) { setStatus("오류: " + err.message); }
      requestAnimationFrame(loop);
    }

    // ---- Feature vector: 52 expression scores + 3 head angles ----
    function featureVec(bs, yaw, pitch, roll) {
      const v = bs.map(c => c.score);
      v.push(yaw / RULES.angleScale, pitch / RULES.angleScale, roll / RULES.angleScale);
      return v;
    }
    function dist(a, b) {
      let sum = 0;
      for (let i = 0; i < a.length; i++) { const d = a[i] - b[i]; sum += d * d; }
      return Math.sqrt(sum);
    }

    // ---- Face box from landmarks (coordinates are 0..1 of the frame) ----
    function faceBox(lm) {
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const p of lm) {
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      }
      const w = maxX - minX, h = maxY - minY;
      const ix = Math.max(0, Math.min(maxX, 1) - Math.max(minX, 0));
      const iy = Math.max(0, Math.min(maxY, 1) - Math.max(minY, 0));
      return { h, inside: (ix * iy) / (w * h) };
    }

    function step() {
      if (video.readyState < 2) return;   // camera is switching, no frame yet
      if (video.currentTime === lastVideoTime) return;
      lastVideoTime = video.currentTime;
      frameCount++;

      const now = performance.now();
      const result = landmarker.detectForVideo(video, now);
      const hasFace = result.faceLandmarks && result.faceLandmarks.length > 0;
      let okNose = false, okCenter = false, okDist = false, okAngle = false, still = false, framed = false;
      let settled = false, waitingChange = false;
      let hint = null;
      let dbg = "face: no";

      if (hasFace) {
        noFaceSince = 0;
        const lm = result.faceLandmarks[0];
        const { yaw, pitch, roll } = matrixToAngles(result.facialTransformationMatrixes[0].data);
        const bs = result.faceBlendshapes[0].categories;
        const box = faceBox(lm);
        const nose = lm[NOSE_TIP], chin = lm[CHIN];

        // Composition: where is the nose tip compared with the target point?
        const dy = nose.y - RULES.noseY;   // + means the nose is below the line
        const dx = nose.x - 0.5;           // + means the nose is right of center
        // Hysteresis: once a condition is met it stays met inside a wider band,
        // so small hand tremor near the limit does not flip it on and off
        okNose = Math.abs(dy) <= RULES.tolY * (hold.nose ? 1.6 : 1);
        okCenter = Math.abs(dx) <= RULES.tolX * (hold.center ? 1.6 : 1);
        const sm = hold.dist ? 0.03 : 0, pm = hold.angle ? 5 : 0;
        const okSize = box.h >= RULES.sizeMin - sm && box.h <= RULES.sizeMax + sm;
        const okPitch = pitch >= RULES.pitchMin - pm && pitch <= RULES.pitchMax + pm;
        okDist = okSize;
        okAngle = okPitch;
        hold.nose = okNose; hold.center = okCenter; hold.dist = okSize; hold.angle = okPitch;

        // One spoken hint at a time, most important first
        if (!okSize) hint = box.h < RULES.sizeMin ? "조금 더 가까이" : "조금 더 멀리";
        else if (!okNose) hint = dy > 0 ? "폰 위치를 아래로" : "폰 위치를 위로";
        else if (!okCenter) hint = dx < 0 ? "폰 위치를 오른쪽으로" : "폰 위치를 왼쪽으로";
        else if (!okPitch) hint = pitch < RULES.pitchMin ? "폰을 더 눕혀요" : "폰을 더 세워요";
        framed = !hint;

        // Is the face holding still? Compare with the sample from ~300 ms ago
        const vec = featureVec(bs, yaw, pitch, roll);
        while (recent.length && now - recent[0].t > RULES.stillMs + 200) recent.shift();
        const old = recent.length && now - recent[0].t >= RULES.stillMs ? recent[0] : null;
        const move = old ? dist(vec, old.vec) : Infinity;
        still = move < RULES.stillMax;
        recent.push({ t: now, vec });

        // Coming back into the composition after more than a second away
        // always earns a new photo, even with the same expression as before
        if (framed) {
          if (!framedSince) {
            if (now - lastFramedAt > 1000) lastShotVec = null;
            framedSince = now;
          }
          lastFramedAt = now;
        } else {
          framedSince = 0;
        }
        // "Still" by measurement, or simply held in the composition long enough
        settled = still || (framed && now - framedSince > 1200);

        const change = lastShotVec ? dist(vec, lastShotVec) : Infinity;
        const full = photoCount >= RULES.maxPhotos;
        // Shoot whenever the composition is right and held, whatever the expression;
        // keep shooting every few seconds while it stays right
        if (framed && settled && !full && now - lastShotAt >= RULES.minGapMs) {
          lastShotAt = now;
          lastShotVec = vec;
          takePhoto();
          replay(flashEl);
          mascotShot();
          beep(1500, 60);                       // shutter sound: two quick clicks
          setTimeout(() => beep(1500, 60), 120);
        }

        dbg = `nose x ${(nose.x * 100).toFixed(0)}% y ${(nose.y * 100).toFixed(0)}%<br>` +
              `chin y ${(chin.y * 100).toFixed(0)}%<br>` +
              `size  ${(box.h * 100).toFixed(0)}%<br>` +
              `yaw ${yaw.toFixed(0)}° pitch ${pitch.toFixed(0)}° roll ${roll.toFixed(0)}°<br>` +
              `move  ${isFinite(move) ? move.toFixed(2) : "-"}<br>` +
              `change ${isFinite(change) ? change.toFixed(2) : "-"}`;
      } else {
        recent.length = 0;
        framedSince = 0;
        hold.nose = hold.center = hold.dist = hold.angle = false;
        if (!noFaceSince) noFaceSince = now;
      }

      // Sound: one short beep each time a single condition becomes right
      // (higher tone the more conditions are met), long high beep when all are right,
      // low beep when the full composition is lost
      const oks = { dist: okDist, nose: okNose, center: okCenter, angle: okAngle };
      const metCount = Object.values(oks).filter(Boolean).length;
      let newlyMet = false;
      for (const k in oks) {
        if (oks[k] && !prevOk[k] && now - (okBeepAt[k] || 0) > 3000) {
          newlyMet = true;
          okBeepAt[k] = now;
        }
        prevOk[k] = oks[k];
      }
      if (framed) {
        if (!framedOk) { beep(1050, 260); framedOk = true; }   // announced once
        lostAt = 0;
      } else {
        if (framedOk) {
          // Only announce "lost" if it stays lost for a moment
          if (!lostAt) lostAt = now;
          else if (now - lostAt > 800) { beep(330); framedOk = false; lostAt = 0; sulkUntil = now + 3000; }
        } else if (newlyMet) {
          beep(440 + metCount * 110, 80);
        }
      }

      // Mascot mood follows what is happening
      let face = "idle";
      if (now < shotUntil) face = "shot";
      else if (now < wakeUntil) face = "wake";
      else if (photoCount >= RULES.maxPhotos) face = "sorry";
      else if (framed) face = "happy";
      else if (now < sulkUntil) face = "sulk";
      else if (!hasFace && noFaceSince && now - noFaceSince > 5000) face = "sleep";
      else if (hasFace && hint && now - hintSince > 14000) face = "cry";
      else if (hasFace && hint && now - hintSince > 7000) face = "angry";
      else if (hasFace && metCount === 3) face = "excited";
      setFaces("mini", face);
      if (face === "sleep") wasSleeping = true;
      else if (hasFace && wasSleeping) { wasSleeping = false; wakeUntil = now + 2500; }
      setChip(chips.dist, okDist);
      setChip(chips.angle, okAngle);
      setChip(chips.nose, okNose);
      setChip(chips.center, okCenter);
      setChip(chips.still, still);

      if (!hasFace) {
        setStatus("얼굴을 찾는 중");
      } else if (hint) {
        setStatus(hint);
        // Speak only when the same hint has been needed for a moment
        if (hint !== hintText) { hintText = hint; hintSince = now; }
        if (now - hintSince > 900) say(hint, now);
      } else if (photoCount >= RULES.maxPhotos) {
        setStatus(`${RULES.maxPhotos}장 다 찍었어요`, true);
      } else if (!settled) {
        setStatus("좋아요, 그대로 멈춰요", true);
      } else {
        setStatus("좋아요, 찍는 중", true);
      }

      if (debugEl.classList.contains("show")) {
        debugEl.innerHTML = `${dbg}<br>${camInfo}<br>frame ${frameCount}<br>${VERSION}`;
      }
    }

    // ---- Copy the current video frame into a JPEG (stays on the phone) ----
    function takePhoto() {
      // 1) Grab the frame right now
      const c = document.createElement("canvas");
      c.width = video.videoWidth;
      c.height = video.videoHeight;
      c.getContext("2d").drawImage(video, 0, 0);

      // 2) Show a small thumbnail immediately (fast)
      const t = document.createElement("canvas");
      t.width = 160;
      t.height = Math.round(160 * c.height / c.width);
      t.getContext("2d").drawImage(c, 0, 0, t.width, t.height);
      const photo = { blob: null, name: `selfie_${Date.now()}.jpg`, url: t.toDataURL("image/jpeg", 0.7) };
      const img = document.createElement("img");
      img.src = photo.url;
      img.alt = photo.name;
      photo.img = img;
      img.addEventListener("click", () => openViewer(photo));
      const hint = $("emptyHint");
      if (hint) hint.remove();
      gallery.prepend(img);
      photoCount++;
      photoCountEl.textContent = photoCount;

      // 3) Make the full-size JPEG in the background (slower)
      c.toBlob((blob) => {
        if (!blob) return;
        photo.blob = blob;
        photo.url = URL.createObjectURL(blob);
        if (viewing === photo) viewerImg.src = photo.url;
      }, "image/jpeg", 0.95);
    }

    // ---- Photo viewer: save (download) or share ----
    function openViewer(photo) {
      viewing = photo;
      viewerImg.src = photo.url;
      viewer.classList.add("show");
    }
    $("closeBtn").addEventListener("click", () => viewer.classList.remove("show"));
    $("delBtn").addEventListener("click", () => {
      if (!viewing) return;
      viewing.img.remove();
      if (viewing.blob) URL.revokeObjectURL(viewing.url);
      photoCount--;
      photoCountEl.textContent = photoCount;
      viewing = null;
      viewer.classList.remove("show");
    });
    $("saveBtn").addEventListener("click", () => {
      if (!viewing || !viewing.blob) return;   // full-size file not ready yet
      const a = document.createElement("a");
      a.href = viewing.url;
      a.download = viewing.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
    });
    $("shareBtn").addEventListener("click", async () => {
      if (!viewing || !viewing.blob) return;
      const file = new File([viewing.blob], viewing.name, { type: "image/jpeg" });
      if (!(navigator.canShare && navigator.canShare({ files: [file] }))) {
        $("viewerNote").textContent = "이 브라우저는 공유를 지원하지 않아요. 저장을 눌러주세요.";
        return;
      }
      try { await navigator.share({ files: [file] }); } catch (e) { /* user cancelled */ }
    });

    $("debugBtn").addEventListener("click", () => debugEl.classList.toggle("show"));

    // ---- Reference photo analysis: numbers only, photos never leave the phone ----
    let imageLandmarker = null;
    async function getImageLandmarker() {
      if (!imageLandmarker) {
        imageLandmarker = await FaceLandmarker.createFromOptions(await getFileset(), {
          baseOptions: { modelAssetPath: MODEL_URL, delegate: "CPU" },
          runningMode: "IMAGE",
          numFaces: 3,
          outputFacialTransformationMatrixes: true
        });
      }
      return imageLandmarker;
    }

    async function analyzeFile(file) {
      const bmp = await createImageBitmap(file);
      const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas");
      c.width = Math.round(bmp.width * k);
      c.height = Math.round(bmp.height * k);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      bmp.close();
      const res = (await getImageLandmarker()).detect(c);
      if (!res.faceLandmarks || res.faceLandmarks.length === 0) return null;
      // If several faces are found, use the biggest one
      let best = 0, bestH = 0;
      res.faceLandmarks.forEach((lm, i) => {
        const h = faceBox(lm).h;
        if (h > bestH) { bestH = h; best = i; }
      });
      const lm = res.faceLandmarks[best];
      const a = matrixToAngles(res.facialTransformationMatrixes[best].data);
      return {
        x: lm[NOSE_TIP].x * 100, y: lm[NOSE_TIP].y * 100, chin: lm[CHIN].y * 100,
        size: bestH * 100, yaw: a.yaw, pitch: a.pitch, roll: a.roll,
        shape: c.width > c.height ? "가로" : "세로"
      };
    }

    function median(arr) {
      const v = [...arr].sort((p, q) => p - q);
      const m = Math.floor(v.length / 2);
      return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
    }
    function statLine(label, arr, unit) {
      if (!arr.length) return `${label}: -`;
      return `${label}: 중앙값 ${median(arr).toFixed(0)}${unit} (최소 ${Math.min(...arr).toFixed(0)} ~ 최대 ${Math.max(...arr).toFixed(0)})`;
    }

    $("learnBtn").addEventListener("click", () => $("refInput").click());
    $("refInput").addEventListener("change", async (ev) => {
      const files = [...ev.target.files];
      if (!files.length) return;
      const out = $("refText");
      $("refPanel").classList.add("show");
      const rows = [];
      let failed = 0;
      for (let i = 0; i < files.length; i++) {
        out.textContent = `분석 중… ${i + 1} / ${files.length}\n(처음엔 모델을 불러오느라 10초쯤 걸려요)`;
        try {
          const r = await analyzeFile(files[i]);
          if (r) rows.push(r); else failed++;
        } catch (e) { failed++; }
      }
      const pick = (key) => rows.map(r => r[key]);
      let text = `[${VERSION}] 사진 ${files.length}장 중 얼굴 인식 ${rows.length}장, 실패 ${failed}장\n` +
        `(x, y, 턱, 크기는 사진 가로/세로에 대한 %, 왼쪽 위가 0)\n\n` +
        statLine("코 끝 x", pick("x"), "%") + "\n" +
        statLine("코 끝 y", pick("y"), "%") + "\n" +
        statLine("턱 끝 y", pick("chin"), "%") + "\n" +
        statLine("얼굴 크기", pick("size"), "%") + "\n" +
        statLine("yaw", pick("yaw"), "°") + "\n" +
        statLine("pitch", pick("pitch"), "°") + "\n" +
        statLine("roll", pick("roll"), "°") + "\n\n사진별:\n";
      rows.forEach((r, i) => {
        text += `${i + 1}. ${r.shape} x${r.x.toFixed(0)} y${r.y.toFixed(0)} 턱${r.chin.toFixed(0)} 크기${r.size.toFixed(0)} ` +
                `yaw${r.yaw.toFixed(0)} pitch${r.pitch.toFixed(0)} roll${r.roll.toFixed(0)}\n`;
      });
      out.textContent = text;
      ev.target.value = "";
    });
    $("refClose").addEventListener("click", () => $("refPanel").classList.remove("show"));
    $("refCopy").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText($("refText").textContent);
        $("refCopy").textContent = "복사됨 ✓";
      } catch (e) {
        $("refCopy").textContent = "복사 실패 (길게 눌러 복사)";
      }
    });

      </svg>`.replace(/stroke-width="([\d.]+)"/g, (m, v) => `stroke-width="${(v * 0.5).toFixed(2)}"`);   // thin lines
    }
    // The girl shows every feeling on her face; the boy stays calm and steady
    const FACES = ["idle", "excited", "happy", "shot", "sulk", "angry", "cry", "sorry", "sleep", "wake"];
    const BOY_FACE = { idle: "calm", excited: "warm", happy: "warm", shot: "love", sulk: "care",
                       angry: "care", cry: "care", sorry: "care", sleep: "calm", wake: "calm" };
    function setFace(el, face) { if (el.dataset.face !== face) el.dataset.face = face; }
    // Two monkeys: the girl takes the photo, the boy keeps her company
    function setFaces(prefix, face) {
      setFace($(prefix + "Girl"), face);
      setFace($(prefix + "Boy"), BOY_FACE[face]);
    }
    $("miniGirl").innerHTML = mascotSVG("girl");
    $("miniBoy").innerHTML = mascotSVG("boy");
    setFaces("mini", "idle");

    // Start screen: five couple "stickers" scattered here and there (not in a neat grid)
    const STICKERS = [
      { face: "excited", size: 84, left: "5%",  top: "7%",  rot: -11, delay: 0 },
      { face: "sulk",    size: 66, left: "58%", top: "15%", rot: 9,   delay: -0.7 },
      { face: "sleep",   size: 58, left: "22%", top: "22%", rot: 5,   delay: -1.3 },
      { face: "angry",   size: 70, left: "3%",  top: "66%", rot: 8,   delay: -1.9 },
      { face: "sorry",   size: 78, left: "55%", top: "71%", rot: -8,  delay: -2.4 }
    ];
    for (const st of STICKERS) {
      const pair = document.createElement("div");
      pair.className = "pair";
      pair.style.cssText = `left:${st.left};top:${st.top};transform:rotate(${st.rot}deg)`;
      const inner = document.createElement("div");
      inner.style.animationDelay = st.delay + "s";
      const g = document.createElement("div"), b = document.createElement("div");
      g.className = b.className = "mascot";
      g.style.width = g.style.height = b.style.width = b.style.height = st.size + "px";
      g.innerHTML = mascotSVG("girl");
      b.innerHTML = mascotSVG("boy");
      setFace(g, st.face);
      setFace(b, BOY_FACE[st.face]);
      inner.append(g, b);
      pair.appendChild(inner);
      $("startMascot").appendChild(pair);
    }

    let shotUntil = 0, wakeUntil = 0, sulkUntil = 0, wasSleeping = false;
    function mascotShot() {
      shotUntil = performance.now() + 1100;
      replay($("miniMascot"));
    }

    // ---- Start button: sound + camera + model ----
    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      try {
        // iPhone only allows sound after a tap, so create audio here
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        await audioCtx.resume();
        say("시작할게요", performance.now());   // iPhone needs the first speech inside a tap

        startMsg.textContent = "카메라 켜는 중…";
        const activeId = await startCamera(null);
        await setupCameraList(activeId);

        startMsg.textContent = "얼굴 인식 준비 중… (처음엔 10초 정도)";
        landmarker = await createLandmarker();

        startScreen.style.display = "none";
        beep(660, 100);
        loop();
      } catch (err) {
        startMsg.textContent = "실패: " + err.name + " - " + err.message;
        startBtn.disabled = false;
      }
    });
  </script>
