<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selfie Cam</title>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: sans-serif; text-align: center; }
    video { width: 100%; max-height: 60vh; background: #222; }
    button { font-size: 20px; padding: 14px 28px; margin: 16px; border-radius: 12px; border: none; }
    #status { padding: 8px; font-size: 16px; }
    #gallery img { width: 30%; margin: 1%; border-radius: 8px; }
    #info { font-size: 22px; line-height: 1.6; padding: 8px; font-family: monospace; }
  </style>
</head>
<body>
  <button id="startBtn">시작</button>
  <div id="status">시작 버튼을 누르세요</div>
  <select id="camSelect" style="display:none; font-size:16px; padding:8px; margin:8px;"></select>
  <!-- playsinline + muted are required for inline video on iPhone Safari -->
  <video id="video" autoplay playsinline muted></video>
  <div id="info"></div>
  <div id="hint" style="display:none; font-size:14px; padding:4px;">사진을 누르면 저장/공유할 수 있어요</div>
  <div id="gallery"></div>

  <script type="module">
    // MediaPipe Tasks Vision (runs fully on-device, in the browser)
    import { FaceLandmarker, FilesetResolver }
      from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

    const WASM_URL  = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
    const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";

    const btn    = document.getElementById('startBtn');
    const video  = document.getElementById('video');
    const status = document.getElementById('status');
    const info   = document.getElementById('info');

    let landmarker = null;
    let audioCtx = null;
    let faceVisible = false;
    let lastVideoTime = -1;
    let currentStream = null;
    let camInfo = '';
    const camSelect = document.getElementById('camSelect');
    const CAM_KEY = 'selfiecam.deviceId.v3';

    // ---- Camera: open a rear camera at high resolution ----
    async function startCamera(deviceId) {
      if (currentStream) currentStream.getTracks().forEach(t => t.stop());
      const v = { width: { ideal: 1920 }, height: { ideal: 1080 } };
      if (deviceId) v.deviceId = { exact: deviceId };
      else v.facingMode = { ideal: 'environment' };
      currentStream = await navigator.mediaDevices.getUserMedia({ video: v, audio: false });
      video.srcObject = currentStream;
      await video.play();
      const s = currentStream.getVideoTracks()[0].getSettings();
      camInfo = `${s.width}x${s.height}`;
      return s.deviceId;
    }

    function loadSavedCam() {
      try { return localStorage.getItem(CAM_KEY); } catch (e) { return null; }
    }
    function saveCam(id) {
      try { localStorage.setItem(CAM_KEY, id); } catch (e) { /* ignore */ }
    }

    // ---- List rear cameras (phones often have wide / ultra-wide / tele) ----
    async function setupCameraList(activeId) {
      const all = (await navigator.mediaDevices.enumerateDevices())
        .filter(d => d.kind === 'videoinput');
      let cams = all.filter(d => /back|rear|environment|후면/i.test(d.label));
      if (cams.length === 0) cams = all;

      camSelect.innerHTML = '';
      cams.forEach((d, i) => {
        const opt = document.createElement('option');
        opt.value = d.deviceId;
        opt.textContent = d.label || `Camera ${i + 1}`;
        camSelect.appendChild(opt);
      });
      if (cams.length > 1) camSelect.style.display = 'inline-block';

      // Pick: saved choice first, else the ultra-wide rear camera
      // (iPhone label contains "Ultra Wide" / "초광각", Samsung uses "camera2 2")
      const saved = loadSavedCam();
      let want = cams.find(d => d.deviceId === saved);
      if (!want) want = cams.find(d => /ultra|초광각/i.test(d.label));
      if (!want) want = cams.find(d => /camera2 2,/i.test(d.label));
      if (want && want.deviceId !== activeId) {
        activeId = await startCamera(want.deviceId);
      }
      camSelect.value = activeId;
    }

    camSelect.addEventListener('change', async () => {
      try {
        await startCamera(camSelect.value);
        saveCam(camSelect.value);
      } catch (err) {
        status.textContent = '카메라 전환 실패: ' + err.name + ' - ' + err.message;
      }
    });

    // ---- Sound: short beep using Web Audio (no audio files needed) ----
    function beep(freq = 880, durationMs = 150) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      gain.gain.value = 0.3;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + durationMs / 1000);
    }

    // ---- Load the face model (try GPU first, fall back to CPU) ----
    async function createLandmarker() {
      const fileset = await FilesetResolver.forVisionTasks(WASM_URL);
      const options = (delegate) => ({
        baseOptions: { modelAssetPath: MODEL_URL, delegate },
        runningMode: "VIDEO",
        numFaces: 1,
        outputFaceBlendshapes: true,              // 52 expression scores
        outputFacialTransformationMatrixes: true  // head pose matrix
      });
      // CPU only: on some phones the GPU mode returns frozen / wrong values
      return await FaceLandmarker.createFromOptions(fileset, options("CPU"));
    }

    // ---- 4x4 matrix (column-major) -> yaw / pitch / roll in degrees ----
    function matrixToAngles(m) {
      const r = (row, col) => m[col * 4 + row];
      const toDeg = (rad) => rad * 180 / Math.PI;
      const pitch = toDeg(Math.atan2(r(2, 1), r(2, 2)));  // up / down
      const yaw   = toDeg(Math.asin(-r(2, 0)));            // left / right
      const roll  = toDeg(Math.atan2(r(1, 0), r(0, 0)));  // head tilt
      return { yaw, pitch, roll };
    }

    // ---- Read one expression score by name ----
    function score(blendshapes, name) {
      const c = blendshapes.find(x => x.categoryName === name);
      return c ? c.score : 0;
    }

    // ---- Main loop: run detection on every new video frame ----
    let frameCount = 0;
    function loop() {
      try {
        step();
      } catch (err) {
        // Show the error on screen instead of silently stopping
        status.textContent = '오류: ' + err.name + ' - ' + err.message;
      }
      requestAnimationFrame(loop);
    }

    // ---- Auto-capture rules (simple fixed thresholds for now) ----
    const RULES = {
      smileMin: 0.5,     // smile score must be at least 50%
      blinkMax: 0.4,     // eyes-closed score must be below 40%
      yawMax: 25,        // left/right head angle within +-25 degrees
      pitchMax: 25,      // up/down head angle within +-25 degrees
      holdMs: 500,       // conditions must hold this long
      cooldownMs: 3000   // rest time after each photo
    };
    let state = 'watching';   // 'watching' | 'countdown'
    let okSince = 0;
    let cooldownUntil = 0;
    let photoCount = 0;
    const gallery = document.getElementById('gallery');
    const hint = document.getElementById('hint');
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const mark = (ok) => ok ? '✅' : '❌';

    function step() {
      if (video.readyState < 2) return;   // camera is switching, no frame yet
      if (video.currentTime === lastVideoTime) return;
      lastVideoTime = video.currentTime;
      frameCount++;

      const now = performance.now();
      const result = landmarker.detectForVideo(video, now);
      const hasFace = result.faceLandmarks && result.faceLandmarks.length > 0;
      let allOk = false;
      let html;

      if (hasFace) {
        if (!faceVisible) beep(880);   // high beep: face found
        faceVisible = true;

        const { yaw, pitch, roll } = matrixToAngles(result.facialTransformationMatrixes[0].data);
        const bs = result.faceBlendshapes[0].categories;
        const smile = (score(bs, "mouthSmileLeft") + score(bs, "mouthSmileRight")) / 2;
        const blink = (score(bs, "eyeBlinkLeft") + score(bs, "eyeBlinkRight")) / 2;

        const okSmile = smile >= RULES.smileMin;
        const okEyes  = blink <  RULES.blinkMax;
        const okYaw   = Math.abs(yaw)   <= RULES.yawMax;
        const okPitch = Math.abs(pitch) <= RULES.pitchMax;
        allOk = okSmile && okEyes && okYaw && okPitch;

        html =
          `얼굴: ✅<br>` +
          `좌우(yaw): ${yaw.toFixed(0)}° ${mark(okYaw)}<br>` +
          `상하(pitch): ${pitch.toFixed(0)}° ${mark(okPitch)}<br>` +
          `기울기(roll): ${roll.toFixed(0)}°<br>` +
          `미소: ${(smile * 100).toFixed(0)}% ${mark(okSmile)}<br>` +
          `눈 감음: ${(blink * 100).toFixed(0)}% ${mark(okEyes)}`;
      } else {
        if (faceVisible) beep(330);    // low beep: face lost
        faceVisible = false;
        html = `얼굴: ❌ (찾는 중)`;
      }

      // Decide whether to start the countdown
      let label = '조건 기다리는 중';
      if (state === 'countdown') {
        label = '곧 촬영! 📸';
      } else if (now < cooldownUntil) {
        label = '잠시 쉬는 중';
        okSince = 0;
      } else if (!allOk) {
        okSince = 0;
      } else if (!okSince) {
        okSince = now;
      } else if (now - okSince >= RULES.holdMs) {
        okSince = 0;
        countdownAndShoot();
      }

      html += `<br>상태: ${label}<br>찍은 사진: ${photoCount}장`;
      html += `<br><small>v3.0 / ${camInfo} / frame ${frameCount}</small>`;
      info.innerHTML = html;
    }

    // ---- Beep-beep-beep, then take the photo ----
    async function countdownAndShoot() {
      state = 'countdown';
      try {
        for (let i = 0; i < 3; i++) {
          beep(1000, 120);
          await sleep(450);
        }
        if (faceVisible) {
          takePhoto();
          beep(1500, 60);                       // shutter sound: two quick clicks
          setTimeout(() => beep(1500, 60), 120);
        } else {
          beep(220, 300);                       // cancelled: face left the frame
        }
      } finally {
        cooldownUntil = performance.now() + RULES.cooldownMs;
        state = 'watching';
      }
    }

    // ---- Copy the current video frame into a JPEG (stays on the phone) ----
    function takePhoto() {
      const c = document.createElement('canvas');
      c.width = video.videoWidth;
      c.height = video.videoHeight;
      c.getContext('2d').drawImage(video, 0, 0);
      c.toBlob((blob) => {
        if (!blob) return;
        photoCount++;
        const name = `selfie_${Date.now()}.jpg`;
        const img = document.createElement('img');
        img.src = URL.createObjectURL(blob);
        img.alt = name;
        img.addEventListener('click', () => savePhoto(blob, name));
        gallery.prepend(img);
        hint.style.display = 'block';
      }, 'image/jpeg', 0.95);
    }

    // ---- Tap a photo: share sheet if available, otherwise download ----
    async function savePhoto(blob, name) {
      const file = new File([blob], name, { type: 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); } catch (e) { /* user cancelled */ }
        return;
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
    }

    // ---- Start button: sound + camera + model ----
    btn.addEventListener('click', async () => {
      btn.style.display = 'none';
      try {
        // iPhone only allows sound after a tap, so create audio here
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        await audioCtx.resume();

        status.textContent = '카메라 켜는 중...';
        const activeId = await startCamera(null);
        await setupCameraList(activeId);

        status.textContent = '얼굴 인식 모델 불러오는 중... (처음엔 10초 정도)';
        landmarker = await createLandmarker();

        status.textContent = '준비 완료 ✅ 얼굴을 비춰보세요';
        beep(660, 100);
        loop();
      } catch (err) {
        status.textContent = '실패: ' + err.name + ' - ' + err.message;
        btn.style.display = 'inline-block';
      }
    });
  </script>
</body>
</html>
